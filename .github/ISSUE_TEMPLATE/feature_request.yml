name: "🌟 Feature Request"
description: "Suggest a new feature or improvement for the Servv plugin."
title: "[Feature]: "
labels: ["type:feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please give us a short summary and tell us the problem this will solve.

  - type: input
    id: summary
    attributes:
      label: Feature Summary
      description: One-line description of your idea.
      placeholder: e.g. Add Google Location auto-suggest in booking form
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve for you?
      placeholder: e.g. Users mistype addresses, causing booking errors.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution (optional)
      description: If you have an idea for how this could work, share it here.
      placeholder: e.g. Use Google Places autocomplete in the location field.
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: How important is this feature to you?
      description: Helps us prioritize better.
      options:
        - "Nice to have"
        - "Useful"
        - "Critical for my workflow"
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots / Mockups (optional)
      description: Add screenshots, sketches, or links if you have them.
      placeholder: Drag and drop files here
    validations:
      required: false
