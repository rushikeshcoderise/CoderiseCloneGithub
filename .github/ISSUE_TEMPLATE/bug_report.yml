name: "🐞 Bug Report"
description: "Quickly report something that isn’t working in the Servv plugin."
title: "[Bug]: "
labels: ["type:bug"]
assignees: []

body:
  - type: input
    id: summary
    attributes:
      label: What went wrong?
      description: A short one-line summary of the issue.
      placeholder: e.g. Booking form does not save custom fields
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Tell us what happened (steps + expected vs actual in your own words).
      placeholder: |
        Steps:
        1. Go to ...
        2. Click ...
        3. Error shows

        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs (optional)
      description: Drag & drop screenshots, error logs, or paste error messages.
      placeholder: Drop files or paste logs here
