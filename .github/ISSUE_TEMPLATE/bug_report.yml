name: "🐞 Bug Report"
description: "Report something that isn’t working as expected."
title: "[Bug]: "
labels: ["type:bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so we can investigate.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of the issue.
      placeholder: e.g. Booking form does not save custom fields
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: e.g. Booking form should save custom fields correctly
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: e.g. Custom fields are ignored after submission
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: If applicable, add screenshots or logs.
      placeholder: Drag and drop files here
