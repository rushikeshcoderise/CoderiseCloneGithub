name: Comment on new issues with secure support link
on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const supportBase = "https://servv-support-worker.rushikesh-gulhane.workers.dev"; 
            const supportUrl = `${supportBase}?issue=${issueNumber}&repo=${owner}/${repo}`;
            const body = `Thanks — we received your report (issue #${issueNumber}).\n\n⚠️ **Do not post usernames or passwords in this issue.**\n\nTo help us investigate, please submit your Site Name & URL (and any short notes) securely here:\n\n${supportUrl}\n\nWe will use the provided site info to investigate and will reach out if we need credentials.`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body
            });
