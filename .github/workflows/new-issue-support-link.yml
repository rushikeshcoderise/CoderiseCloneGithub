name: Support token links (create + reissue)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  create-on-open:
    name: Create token & post link on issue open
    if: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create token (call support worker)
        id: create_token
        run: |
          set -euo pipefail
          OWNER_REPO="${GITHUB_REPOSITORY}"
          ISSUE_NUM="${{ github.event.issue.number }}"

          resp=$(curl -s -X POST "https://servv-support-worker.rushikesh-gulhane.workers.dev/api/create-token" \
            -H "x-create-secret: ${{ secrets.ACTION_KEY }}" \
            -F "issue=${ISSUE_NUM}" \
            -F "repo=${OWNER_REPO}")

          echo "$resp" > token.json
          url=$(jq -r .url token.json)
          token=$(jq -r .token token.json)
          if [ "$url" = "null" ] || [ -z "$url" ]; then
            echo "Failed to create token: $resp"
            exit 1
          fi
          echo "::set-output name=url::$url"
          echo "::set-output name=token::$token"

      - name: Comment on the issue with secure link (short label)
        run: |
          set -euo pipefail
          ISSUE_NUM="${{ github.event.issue.number }}"
          OWNER_REPO="${GITHUB_REPOSITORY}"
          URL="${{ steps.create_token.outputs.url }}"

          # Build a neat markdown comment using a short link label.
          COMMENT_BODY=$(printf "Thanks — we received your report (issue #%s).\n\n⚠️ Do not post usernames or passwords in this issue.\n\nTo help us investigate, please submit your Site Name & URL (and any short notes) securely here:\n\n[Submit securely](%s)\n\n(Links expire after 15 minutes.)\n\nWe will use the provided site info to investigate and will reach out if we need credentials." "$ISSUE_NUM" "$URL")

          PAYLOAD=$(jq -nc --arg b "$COMMENT_BODY" '{body: $b}')

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/issues/${ISSUE_NUM}/comments" \
            -d "$PAYLOAD"

      - name: Lock issue (prevent new public comments)
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUM}/lock" \
            -d '{"lock_reason":"resolved"}'

  reissue-on-comment:
    name: Reissue token when author requests
    if: ${{ github.event_name == 'issue_comment' && github.event.action == 'created' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check if commenter is issue author and body contains /request-link (case-insensitive)
        id: check
        run: |
          set -euo pipefail
          COMMENTER="${{ github.event.comment.user.login }}"
          ISSUE_AUTHOR="${{ github.event.issue.user.login }}"
          BODY="${{ github.event.comment.body }}"

          echo "Commenter: $COMMENTER"
          echo "Issue author: $ISSUE_AUTHOR"
          echo "Comment body: $BODY"

          if [ "$COMMENTER" != "$ISSUE_AUTHOR" ]; then
            echo "Not the issue author — skipping reissue."
            echo "::set-output name=proceed::false"
            exit 0
          fi

          # case-insensitive substring match
          LOWER=$(echo "$BODY" | tr '[:upper:]' '[:lower:]')
          if ! echo "$LOWER" | grep -q "/request-link"; then
            echo "Comment does not contain /request-link — skipping."
            echo "::set-output name=proceed::false"
            exit 0
          fi

          echo "::set-output name=proceed::true"

      - name: Create a new token (if requested)
        if: ${{ steps.check.outputs.proceed == 'true' }}
        id: create_token2
        run: |
          set -euo pipefail
          OWNER_REPO="${GITHUB_REPOSITORY}"
          ISSUE_NUM="${{ github.event.issue.number }}"

          resp=$(curl -s -X POST "https://servv-support-worker.rushikesh-gulhane.workers.dev/api/create-token" \
            -H "x-create-secret: ${{ secrets.ACTION_KEY }}" \
            -F "issue=${ISSUE_NUM}" \
            -F "repo=${OWNER_REPO}")

          echo "$resp" > token2.json
          url=$(jq -r .url token2.json)
          token=$(jq -r .token token2.json)
          if [ "$url" = "null" ] || [ -z "$url" ]; then
            echo "Failed to create token: $resp"
            exit 1
          fi
          echo "::set-output name=url::$url"
          echo "::set-output name=token::$token"

      - name: Post reissue comment with new link (if created)
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          ISSUE_NUM="${{ github.event.issue.number }}"
          OWNER_REPO="${GITHUB_REPOSITORY}"
          URL="${{ steps.create_token2.outputs.url }}"

          # Use same labeled markdown link so GitHub displays a short label instead of raw URL
          COMMENT_BODY=$(printf "Here’s a fresh secure link (one-time, 15 minutes):\n\n[Submit securely](%s)\n\n⚠️ Do not post credentials in public." "$URL")
          PAYLOAD=$(jq -nc --arg b "$COMMENT_BODY" '{body: $b}')

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/issues/${ISSUE_NUM}/comments" \
            -d "$PAYLOAD"

      - name: Re-lock issue (if reissued)
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUM}/lock" \
            -d '{"lock_reason":"resolved"}'
